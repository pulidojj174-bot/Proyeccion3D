<!-- Services -->
<app-hero-header [title]="servicesHeroData().title" [description]="servicesHeroData().description"
  [config]="servicesHeroData().config">
</app-hero-header>
<!-- Nueva sección de servicios -->
<section>
  @for (service of servicesData(); track service.id) {
    <div [id]="service.id" class="service-section-wrapper">
      <app-services-section-item [services]="[service]" [showTitle]="false" />
    </div>
  }
</section>
<!-- Nueva sección de proceso -->
<app-process-section [processData]="processData()" />
<app-cta-section [title]="ctaData().title" [description]="ctaData().description" [backgroundImage]="ctaData().backgroundImage"
  [button]="ctaData().button" [highlightedWord]="ctaData().highlightedWord">
</app-cta-section>
